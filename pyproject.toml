[project]
name = "library-qa"
version = "0.1.0"
description = "도서관 관리 시스템 풀스택 E2E 검증 서비스"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "fastembed>=0.9.0",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pymysql>=1.1",
    "pytest>=8.3",
    "pytest-playwright>=0.5",
    "pyyaml>=6.0",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
qa = "qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qa"]

[tool.pytest.ini_options]
testpaths = ["scenarios"]
