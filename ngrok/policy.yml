# 공개 주소로는 Slack 입구 웹훅(n8n/workflows/qa-slack-inbound.json의 webhookId)만 통과시킨다.
# n8n 편집 화면·REST API·출구 웹훅(qa-result)은 로컬(localhost:5678)에서만 접근한다.
on_http_request:
  - expressions:
      - "!req.url.path.startsWith('/webhook/074f0964-db8e-4290-9a75-e558650b96f1/')"
    actions:
      - type: custom-response
        config:
          status_code: 404
          content: not found
