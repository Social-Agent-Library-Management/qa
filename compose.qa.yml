# QA 전용 인프라. 개발용 library 프로젝트(3306/9200, 바인드 마운트 데이터)와 포트·볼륨을 공유하지 않는다.
# 데이터는 tmpfs라 컨테이너를 내리면 사라진다 — 매 실행은 seed 리셋으로 시작하므로 영속할 이유가 없다.
name: library-qa

services:
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: qa
      MYSQL_DATABASE: library_qa
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pqa"]
      interval: 3s
      timeout: 3s
      retries: 40

  # 작업 큐. 작업 이력(접수·시작·종료 시각)이 지표의 원천이라 tmpfs가 아닌 볼륨에 둔다.
  redis:
    image: redis:8
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  opensearch:
    build:
      context: ${QA_BACKEND_DIR}/docker/opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - action.auto_create_index=false
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Asia/Seoul
    ports:
      - "9201:9200"
    tmpfs:
      - /usr/share/opensearch/data:uid=1000,gid=1000
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  # 통합 계층: Slack 입구·출구만 담당하고 검증 로직은 두지 않는다.
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.6
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
      - WEBHOOK_URL=https://${QA_PUBLIC_DOMAIN}/
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Slack이 이벤트를 보낼 공개 주소. 트래픽 정책으로 Slack 입구 웹훅 경로만 열고
  # n8n 편집 화면·출구 웹훅은 외부에 노출하지 않는다. authtoken은 호스트 ngrok 설정을 그대로 읽는다.
  ngrok:
    image: ngrok/ngrok:3.39.8-alpine
    command:
      - http
      - --config=/etc/ngrok/auth.yml
      - --url=${QA_PUBLIC_DOMAIN}
      - --traffic-policy-file=/etc/ngrok/policy.yml
      - n8n:5678
    volumes:
      - "${HOME}/Library/Application Support/ngrok/ngrok.yml:/etc/ngrok/auth.yml:ro"
      - ./ngrok/policy.yml:/etc/ngrok/policy.yml:ro
    depends_on:
      - n8n

volumes:
  redis-data:
  n8n-data:
