const TODAY = '2026-04-01';
const LOANS = [

  { copyNo:'아동-0011', title:'보육교사론',         borrower:'최은영', dept:'사회복지과', date:'2026-03-21T09:30', due:'2026-04-04', returnedAt:'2026-04-01T11:10', status:'returned'},
  { copyNo:'노인-0008', title:'노인복지 실무론',   borrower:'임도연', dept:'기획팀',     date:'2026-03-31T16:45', due:'2026-04-14', returnedAt:null,              status:'loaned'  },
  { copyNo:'사회-0001', title:'사회복지학 개론',     borrower:'박영희', dept:'사회복지과', date:'2026-03-20', due:'2026-04-03', returnedAt:null,         status:'loaned'  },
  { copyNo:'사회-0014', title:'인간행동과 사회환경', borrower:'김철수', dept:'행정과',     date:'2026-03-19', due:'2026-04-02', returnedAt:null,         status:'loaned'  },
  { copyNo:'사회-0007', title:'지역사회복지론',      borrower:'이수진', dept:'기획팀',     date:'2026-03-05', due:'2026-03-19', returnedAt:null,         status:'overdue' },

  { copyNo:'사회-0009', title:'사회복지 정책론',     borrower:'강지원', dept:'행정과',     date:'2026-03-01', due:'2026-03-15', returnedAt:'2026-03-13', status:'returned'},

  { copyNo:'노인-0005', title:'노인복지론',          borrower:'한미선', dept:'기획팀',     date:'2026-03-18', due:'2026-04-01', returnedAt:null,         status:'loaned'  },
];
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
/* Relative timestamps for the activity feed. Seed data carries date-only values, so NOW is derived from TODAY. */
const NOW = new Date(TODAY + 'T14:20:00');
function timeAgo(at) {
  const t = at.length > 10 ? new Date(at) : new Date(at + 'T09:00:00');
  const mins = Math.max(0, Math.round((NOW - t)/60000));
  if (mins < 1)    return '방금 전';
  if (mins < 60)   return `${mins}분 전`;
  const hrs = Math.floor(mins/60);
  if (hrs < 24)    return `${hrs}시간 전`;
  const days = Math.floor(hrs/24);
  if (days === 1)  return '어제';
  if (days < 7)    return `${days}일 전`;
  if (days < 28)   return `${Math.floor(days/7)}주 전`;
  return at.slice(0,10);
}
/* GET /books/search returns suggestion:string|null — independent of result count (high precision: 0 false positives over 250 valid queries). Demo dictionary + bigram fallback stand in for the real search/correction API. */
const SEARCH_TYPO_MAP = { '사회복찌학개론':'사회복지학 개론', '아동복찌론':'아동복지론', '노인복찌론':'노인복지론', '자원봉사롱':'자원봉사론', '가족복찌론':'가족복지론', '사회복지정착론':'사회복지 정새론', '지역사회복지룬':'지역사회복지론', '사회복지실천기숯론':'사회복지 실천기술론' };
/* Loose fallback: when nothing matches exactly, rank books sharing 2-char sequences with the query — this is how a typo can still return many unrelated hits. */
const bigrams = s => { const t=s.replace(/\s/g,''); return Array.from({length:Math.max(0,t.length-1)},(_,i)=>t.slice(i,i+2)); };
const hasBatchim = ch => (ch.charCodeAt(0) - 0xAC00) % 28 !== 0;
const withEul  = w => w + (hasBatchim(w[w.length-1]) ? '을' : '를');
const withEuro = w => w + (hasBatchim(w[w.length-1]) ? '으로' : '로');
const withEun  = w => w + (hasBatchim(w[w.length-1]) ? '은' : '는');
const addDays = (d,n) => { const t=new Date(d); t.setDate(t.getDate()+n); return t.toISOString().slice(0,10); };
const OVERDUE = LOANS.filter(r=>r.status==='overdue')

const COPY_SEED = [

/* ── Shared UI ───────────────────────────────────────── */
function PageHeader({ title, sub, right }) {
  return (
    <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:24}}>
      <div>

      </div>
      {right}
    </div>
  );
}
function Grid2({ children }) {
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px 24px'}}>{children}</div>;
}
function SearchInput({ value, onChange, placeholder='검색' }) {
  return (
    <div style={{position:'relative',flex:1}}>

function Toast({ msg, onClose }) {
  React.useEffect(() => { const t = setTimeout(onClose, 2800); return ()=>clearTimeout(t); }, [msg]);
  return (
    <div style={{position:'fixed',bottom:28,left:'50%',transform:'translateX(-50%)',
      background:'var(--color-text-primary)',color:'#fff',padding:'11px 18px',
      borderRadius:8,fontSize:14,fontFamily:'var(--font-family-base)',fontWeight:500,
      zIndex:9999,boxShadow:'var(--shadow-md)',display:'flex',alignItems:'center',gap:8,letterSpacing:'-0.01em'}}>

      {msg}
    </div>

}

          </div>

function DashboardScreen() {
  const cols = [
    {key:'title',label:'도서명',width:'30%'},{key:'borrower',label:'대출자',width:'12%'},
    {key:'dept',label:'부서',width:'16%',secondary:true},
    {key:'status',label:'활동',width:'14%'},{key:'_at',label:'',width:'14%',secondary:true,nowrap:true},
  ];
  /* An activity is the latest event on a loan: the return if it happened, otherwise the checkout. */
  const activity = LOANS.map(r=>({...r, _at: r.status==='returned' ? r.returnedAt : r.date, _kind: r.status==='returned' ? 'returned' : 'loaned'}))
    .sort((a,b)=> a._at < b._at ? 1 : a._at > b._at ? -1 : 0);
  return (
    <div style={{padding:'32px 40px'}}>
      <PageHeader title="대시보드" sub="도서 관리 현황을 한눈에 확인하세요" />
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(220px, 1fr))',gap:20,marginBottom:24}}>
        <StatCard label="전체 도서"   value={String(BOOKS.length)}  sub="등록된 서지 정보"                                  iconBg="var(--color-primary-light)"  icon={<BookSvg />} />
        <StatCard label="전체 소장본" value={String(COPIES.length)} sub={`대출 가능 ${COPIES.filter(c=>c.status==='available').length}권`} subColor="var(--color-success)" iconBg="var(--color-copy-light)" icon={<CopySvg />} />
        <StatCard label="현재 대출"   value={String(LOANS.filter(r=>r.status!=='returned').length)} sub="활성 대출 건수"     iconBg="var(--color-success-light)" icon={<LoanSvg />} />
        <StatCard label="연체 항목"   value={String(OVERDUE.length)} sub="즉시 확인 필요" subColor="var(--color-danger)"  iconBg="var(--color-danger-light)"  icon={<AlertSvg />} />
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:20,marginBottom:20}}>
        <Card title="최근 활동" noPadding style={{flex:'2 1 480px',minWidth:0}}>
          <DataTable columns={cols} rows={activity} renderCell={(col,v,row)=>{
            if(col.key==='status') return row._kind==='returned'
              ? <Badge status="returned" label="반납" />
              : <Badge status={row.status} />;
            if(col.key==='_at') return <span title={row._at} style={{fontSize:13,color:'var(--color-text-secondary)',whiteSpace:'nowrap'}}>{timeAgo(row._at)}</span>;
            if(col.key==='borrower' && row.status==='returned') return <span style={{fontSize:13,color:'var(--color-text-placeholder)'}}>-</span>;
            return v;
          }} />
        </Card>
        <Card title="연체 목록" titleRight={<span style={{background:'var(--color-danger)',color:'#fff',fontSize:12,fontWeight:600,padding:'2px 8px',borderRadius:9999}}>{OVERDUE.length}</span>} style={{flex:'1 1 360px',minWidth:0}}>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {OVERDUE.map((d,i)=><DdayCard key={i} title={d.title} meta={`${d.borrower} · ${d.dept} · 반납예정: ${d.due}`} daysLeft={-d.over}/>)}
          </div>
        </Card>
      </div>
    </div>
  );
}

function BookRegistrationScreen() {

function BookSearchScreen() {
  const [search, setSearch] = React.useState('');
  const [selected, setSelected] = React.useState(null);
  const exact = BOOKS.filter(b=>!search||b.title.includes(search)||b.author.includes(search)||b.publisher.includes(search)||b.isbn.includes(search));
  const loose = React.useMemo(()=>{
    if(!search || exact.length) return [];
    const gs = bigrams(search);
    if(!gs.length) return [];
    return BOOKS.map(b=>({b,score:gs.filter(g=>(b.title+b.author+b.publisher).replace(/\s/g,'').includes(g)).length}))
      .filter(x=>x.score>=3).sort((a,b)=>b.score-a.score).map(x=>x.b);
  },[search,exact.length]);
  const books = exact.length ? exact : loose;
  /* suggestion no longer depends on the result count */
  const suggestion = search ? (SEARCH_TYPO_MAP[search.replace(/\s/g,'')] || null) : null;
  const showBanner = !!suggestion && !exact.length;
  const bookCols = [
    {key:'title',label:'도서명',width:'32%'},{key:'author',label:'저자',width:'14%'},
    {key:'publisher',label:'출판사',width:'28%',secondary:true},
    {key:'copies',label:'소장본',width:'16%',nowrap:true},
  ];
  const copyCols = [
    {key:'copyNo',label:'관리번호',width:'32%',nowrap:true},{key:'status',label:'상태',width:'24%'},
    {key:'_borrower',label:'대출자',width:'22%'},{key:'_due',label:'반납예정일',width:'22%',secondary:true,nowrap:true},
  ];
  const rows = selected ? copiesOf(selected.title) : [];
  const loanOf = copyNo => LOANS.find(l=>l.copyNo===copyNo && l.status!=='returned');
  return (
    <div style={{padding:'32px 40px'}}>
      <PageHeader title="도서 검색" sub="도서를 검색하고 행을 선택하면 소장본 목록이 표시됩니다" />
      <Card padding="sm" style={{marginBottom:16}}>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          <SearchInput value={search} onChange={e=>{setSearch(e.target.value);setSelected(null);}} placeholder="도서명, 저자 검색" />
          <Button variant="ghost" size="sm" onClick={()=>{setSearch('');setSelected(null);}}>초기화</Button>
        </div>
        {showBanner && <SuggestionBanner query={search} suggestion={suggestion} hasResults={books.length>0} onApply={()=>{setSearch(suggestion);setSelected(null);}} />}
      </Card>
      <div style={{display:'flex',flexWrap:'wrap',gap:20}}>
        <Card title="검색 결과" titleRight={<CountBadge n={`${books.length}건`} />} noPadding style={{flex:'2 1 520px',minWidth:0}}>
          {!exact.length && books.length>0 && (
            <div style={{padding:'10px 20px',borderBottom:'1px solid var(--color-border)',fontSize:12,color:'var(--color-text-secondary)'}}>정확히 일치하는 도서가 없어 유사한 도서를 보여줍니다.</div>
          )}
          <DataTable columns={bookCols} rows={books} pageSize={10}
            emptyText="검색 결과가 없습니다."
            onRowClick={row=>setSelected(row)}
            renderCell={(col,v,row)=>{
              if(col.key==='copies') {
                const avail = copiesOf(row.title).filter(c=>c.status==='available').length;
                return <span style={{fontSize:13,color:'var(--color-text-secondary)'}}>{v}권 <span style={{color:'var(--color-success)',fontWeight:600}}>· 대출가능 {avail}</span></span>;
              }
              if(col.key==='title') return <span style={{fontWeight:selected&&selected.title===row.title?600:400,color:selected&&selected.title===row.title?'var(--color-primary)':'inherit'}}>{v}</span>;
              return v;
            }} />
        </Card>
        <Card title={selected ? `소장본 · ${selected.title}` : '소장본 목록'}
          titleRight={selected ? <CountBadge n={`${rows.length}권`} color="var(--color-copy)" bg="var(--color-copy-light)" /> : null}
          noPadding style={{flex:'1 1 400px',minWidth:0}}>
          {selected ? (
            <React.Fragment>
              <div style={{padding:'12px 20px',borderBottom:'1px solid var(--color-border)',display:'flex',gap:20,flexWrap:'wrap',fontSize:13,color:'var(--color-text-secondary)'}}>
                <span>저자 <b style={{color:'var(--color-text-primary)',fontWeight:600}}>{selected.author}</b></span>
                <span>출판사 <b style={{color:'var(--color-text-primary)',fontWeight:600}}>{selected.publisher}</b></span>
                <span>ISBN <b style={{color:'var(--color-text-primary)',fontWeight:600}}>{selected.isbn}</b></span>
              </div>
              <DataTable columns={copyCols} rows={rows} emptyText="등록된 소장본이 없습니다."
                renderCell={(col,v,row)=>{
                  if(col.key==='status') return <Badge status={row.status}/>;
                  const loan = loanOf(row.copyNo);
                  if(col.key==='_borrower') return loan
                    ? <span style={{fontSize:13}}>{loan.borrower}</span>
                    : <span style={{fontSize:13,color:'var(--color-text-placeholder)'}}>—</span>;
                  if(col.key==='_due') return loan
                    ? <span style={{fontSize:13,color:row.status==='overdue'?'var(--color-danger)':'var(--color-text-secondary)',fontWeight:row.status==='overdue'?600:400}}>{loan.due}</span>
                    : <span style={{fontSize:13,color:'var(--color-text-placeholder)'}}>—</span>;
                  return v;
                }} />
            </React.Fragment>
          ) : (
            <div style={{padding:'56px 24px',textAlign:'center',fontSize:14,color:'var(--color-text-placeholder)'}}>
              왼쪽 목록에서 도서를 선택하세요.
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

function Pill({ text, tone }) {
  const map = {
    ok:   ['var(--color-success)','var(--color-success-light)'],
    warn: ['#8A5A00','#FFF4E0'],
    error:['var(--color-danger)','var(--color-danger-light)'],
    info: ['var(--color-primary)','var(--color-primary-light)'],
  };
  const [c,bg] = map[tone] || map.info;
  return <span style={{fontSize:12,fontWeight:600,color:c,background:bg,padding:'3px 9px',borderRadius:6,whiteSpace:'nowrap'}}>{text}</span>;
}
function Toggle({ on, onChange, label }) {
  return (
    <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:13,color:'var(--color-text-secondary)'}}>
      <span onClick={()=>onChange(!on)} style={{width:38,height:22,borderRadius:9999,background:on?'var(--color-primary)':'var(--color-border)',position:'relative',transition:'background .15s',flexShrink:0}}>
        <span style={{position:'absolute',top:2,left:on?18:2,width:18,height:18,borderRadius:9999,background:'#fff',transition:'left .15s',boxShadow:'var(--shadow-sm)'}}></span>
      </span>
      {label}
    </label>
  );
}
function CheckRow({ checked, onChange, children, style }) {
  return (
    <label style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',...style}}>
      <input type="checkbox" checked={checked} onChange={onChange} style={{width:15,height:15,accentColor:'var(--color-primary)',flexShrink:0}} />
      {children}
    </label>
  );
}

function ExcelImportScreen({ onNavigate }) {

  const pick = demo => { setFile(demo); setPhase('picked'); };

              <div style={{display:'flex',flexDirection:'column',gap:14}}>

function AdminTabsLayout({ active, onNavigate, children }) {
  const [hover, setHover] = React.useState(null);
  return (
    <div>
      <div style={{background:'var(--color-surface)',borderBottom:'1px solid var(--color-border)',padding:'0 40px'}}>
        <div style={{display:'flex',gap:4}}>

            const on = it.id===active;
            return (

                onMouseEnter={()=>setHover(it.id)} onMouseLeave={()=>setHover(null)}

                  fontWeight:on?600:500,color:on?'var(--color-primary)':(hover===it.id?'var(--color-text-primary)':'var(--color-text-secondary)'),

            );

      </div>
      {children}
    </div>

}
/* ── App Root ────────────────────────────────────────── */
function App() {
  const [loggedIn, setLoggedIn] = React.useState(()=>localStorage.getItem('lib_ds_loggedIn')==='1');
  const [screen,   setScreen]   = React.useState(()=>{
    const s = localStorage.getItem('lib_ds_screen');
    return (s && s!=='overdue') ? s : 'dashboard';
  });

  const login    = ()=>{ localStorage.setItem('lib_ds_loggedIn','1'); setLoggedIn(true); };
  const logout   = ()=>{ localStorage.removeItem('lib_ds_loggedIn'); setLoggedIn(false); };
  const navigate = s=>{ localStorage.setItem('lib_ds_screen',s); setScreen(s); };

  if (!loggedIn) return <LoginScreen onLogin={login} />;

  const SCREENS = {
    'dashboard':     <DashboardScreen />,
    'loan-register': <LoanRegistrationScreen />,
    'return':        <ReturnProcessingScreen />,
    'book-search':   <BookSearchScreen />,
  };
  const ADMIN_SCREENS = {
    'book-register': <BookRegistrationScreen />,
    'copy-register': <CopyRegistrationScreen />,
    'loan-history':  <LoanHistoryScreen />,
    'excel-import':  <ExcelImportScreen onNavigate={navigate} />,
    'data-export':   <DataExportScreen />,
  };
  const inAdmin = !!ADMIN_SCREENS[screen] || screen === 'admin';
  const adminId = ADMIN_SCREENS[screen] ? screen : 'book-register';
  const body = inAdmin
    ? <AdminTabsLayout active={adminId} onNavigate={navigate}>{ADMIN_SCREENS[adminId]}</AdminTabsLayout>
    : (SCREENS[screen] || <DashboardScreen />);

  return (
    <div style={{display:'flex',height:'100vh',background:'var(--color-bg)',overflow:'hidden'}}>
      <Sidebar activeId={inAdmin ? 'admin' : screen} onSelect={navigate} onLogout={logout} />
      <main style={{flex:1,overflowY:'auto'}}>
        {body}
      </main>
    </div>
  );
}

(function bootstrap() {
  if (!window.DesignSystem_307f43) { setTimeout(bootstrap, 200); return; }
  ({ Button, Badge, Input, Card, StatCard, DdayCard, DataTable, Sidebar } = window.DesignSystem_307f43);
  ReactDOM.render(<App />, document.getElementById('root'));
})();
